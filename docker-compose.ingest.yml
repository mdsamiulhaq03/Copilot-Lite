# One-off job: load the knowledge base into ChromaDB, then exit.
#
# Run:  docker compose -f docker-compose.ingest.yml up --build
#
# Every run rebuilds the collection from scratch, so it is safe to repeat.

# ChromaDB is saved in the project's data/chroma folder, so you can see it on
# your laptop. docker-compose.yml mounts the same folder: ingestion writes it,
# the agents read it.
name: copilot-lite

services:
  ingest:
    build: ./backend
    image: copilot-lite-backend
    command: ["python", "-m", "scripts.ingest"]
    volumes:
      - ./knowledge:/knowledge:ro # the 88 docs, read-only
      - ./data/chroma:/data/chroma # where ChromaDB saves the chunks (your data/chroma folder)
    # No network at all: proves ingestion is purely local, as the guide requires
    network_mode: none
